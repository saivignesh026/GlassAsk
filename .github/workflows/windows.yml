name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check source and run tests
        run: |
          npm run check
          npm test
      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer and resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Ask-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            package-lock.json
          if-no-files-found: error
